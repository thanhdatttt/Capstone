# VHOST 2: SysInfo Status App (Port 4000)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name status.lab.local sysinfo.local;

    ssl_certificate /etc/ssl/certs/lab-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/lab-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect HTTP (80) -> HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name status.lab.local sysinfo.local;

    return 301 https://$host$request_uri;
}
